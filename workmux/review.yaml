# Overlay for review worktrees. Merges with ~/.config/workmux/config.yaml.
# Window 1: nvim. Window 2: Codex (uses ~/.codex/config.toml unless -m is passed).
# workmux add <handle> --config ~/.config/workmux/review.yaml
mode: session
windows:
  - name: nvim
    panes:
      - command: nvim
        focus: true
  - name: codex
    panes:
      - command: codex
