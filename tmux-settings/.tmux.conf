# ~/.tmux.conf — beginner-friendly tmux config
# Reload after editing:  prefix + r   (or: tmux source-file ~/.tmux.conf)

# ── Prefix key ───────────────────────────────────────────────
# The prefix is the key you press BEFORE any tmux command.
# Keeping the default: Ctrl+b.
set -g prefix C-b

# ── Mouse ────────────────────────────────────────────────────
# Click windows/panes to focus, drag borders to resize, scroll to scroll back.
set -g mouse on

# ── Tabs (windows) at the top ────────────────────────────────
set -g status-position top

# ── Sensible defaults ────────────────────────────────────────
set -g base-index 1           # windows start at 1, not 0 (matches keyboard)
setw -g pane-base-index 1     # panes start at 1 too
set -g renumber-windows on    # close a window -> others renumber, no gaps
set -g history-limit 50000    # bigger scrollback buffer
set -sg escape-time 10        # snappier ESC (helps vim)
set -g focus-events on        # let editors know when focused
set -g mode-keys vi           # vi-style keys in scroll/copy mode
set -g set-clipboard on       # copy to system clipboard

# 256-color / truecolor so themes look right
set -g default-terminal "tmux-256color"

# ── Easier keybindings ───────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes with | and - (and keep current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current directory
bind c new-window -c "#{pane_current_path}"

# Move between panes with prefix + h/j/k/l (vi arrows)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Theme: Catppuccin (owns the status bar) ──────────────────
# flavors: latte (light), frappe, macchiato, mocha (darkest)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# ── Plugins (managed by TPM) ─────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Compose the status line AFTER catppuccin loads its modules.
set -g status-interval 5
set -g status-justify left
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_session} '
set -agF status-right '#{E:@catppuccin_status_date_time}'
set -g @catppuccin_date_time_text ' %a %d %b %H:%M'

# Keep TPM near the end — plugins load here.
run '~/.tmux/plugins/tpm/tpm'

# ── Dark overrides (MUST come after TPM so they win) ─────────
# Deepen catppuccin mocha toward near-black for a low-glare code session.
set -g status-style 'bg=#11111b,fg=#cdd6f4'      # bar -> crust (darkest mocha)
set -g window-status-current-style 'bg=#11111b,fg=#89b4fa,bold'
set -g window-status-style 'bg=#11111b,fg=#6c7086'
set -g message-style 'bg=#11111b,fg=#cdd6f4'

# Pane borders: dim inactive, bright active so focus is obvious while coding.
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Optional: pure black instead of #11111b — swap both bg values above.
